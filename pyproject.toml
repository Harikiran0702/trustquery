[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trustquery"
version = "0.1.0"
description = "Security Questionnaire Evidence Copilot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv==1.2.3",
    "google-genai==2.18.1",
    "pypdf==6.16.1",
    "sentence-transformers==6.0.0",
    "chromadb==1.5.9",
    "rank-bm25==0.2.2",
]

[project.optional-dependencies]
review = ["streamlit==1.66.1"]
test = ["pytest==9.1.1", "openpyxl==3.1.5", "ruff==0.15.0"]
export-test = ["openpyxl==3.1.5"]
authoring = ["reportlab==5.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trustquery = ["candidate_sections_manifest.json", "experimental_policy_plans.json", "review_policy_bundle.json", "prompts/grounded_answer.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["model: requires torch or locally cached Hugging Face models; never downloads models"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
