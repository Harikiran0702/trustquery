[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trustquery"
version = "0.1.0"
description = "Security Questionnaire Evidence Copilot"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = ["python-dotenv",
    "google-genai",]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]